<!doctype html>
<html lang="zh-CN" data-theme="night"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111317" id="js-meta-theme-color"><script src="./assets/theme-init.js"></script>
<title>归档管理后台 · 灵犀日志归档库</title>
<link rel="stylesheet" href="./assets/terminal.css"><link rel="stylesheet" href="./assets/feed.css"><link rel="stylesheet" href="./assets/dual-view.css"><link rel="stylesheet" href="./assets/themes.css"><link rel="stylesheet" href="./assets/content.css">
<link rel="stylesheet" href="./assets/vendor/katex.css"><link rel="stylesheet" href="./assets/vendor/highlight-dark.css" id="code-theme">
<script src="./assets/vendor/marked.js" defer></script><script src="./assets/vendor/purify.js" defer></script><script src="./assets/vendor/highlight.js" defer></script><script src="./assets/vendor/matlab.js" defer></script><script src="./assets/vendor/katex.js" defer></script>
<script src="./assets/markdown.js" defer></script><script src="./assets/api.js" defer></script><script src="./assets/theme.js" defer></script><script src="./assets/admin.js" defer></script>
</head><body class="content-page"><header class="content-topbar"><a class="content-brand" href="./#archive">↖ LINGXI_LOG <span>// ARCHIVE EDITOR</span></a><div class="ef-theme-switcher" role="group" aria-label="配色模式"><button type="button" class="ef-theme-btn" data-set-theme="night">[NIGHT]</button><button type="button" class="ef-theme-btn" data-set-theme="day">[DAY]</button><button type="button" class="ef-theme-btn" data-set-theme="wuling">[WULING]</button></div></header>
<main class="editor-shell">
<section class="auth-panel" aria-labelledby="auth-heading"><div><h1 id="auth-heading">归档编辑台</h1><p>写入笔记、上传影像，发布到日志归档库。</p></div><form id="auth-form"><label for="admin-token">管理口令</label><input id="admin-token" type="password" autocomplete="current-password" placeholder="服务器配置的 ADMIN_TOKEN" required><button class="ef-btn ef-btn-primary" type="submit">连接后台</button><button class="ef-btn ef-btn-ghost" id="logout" type="button">退出并清除</button></form><p id="auth-status" role="status">未连接。口令仅保存在当前浏览器，退出可清除。</p></section>
<form id="post-form" class="editor-form">
<div class="editor-heading"><h2 id="editor-heading">NEW_LOG // 新建归档</h2><div><button type="button" id="new-post" class="ef-btn ef-btn-ghost">新建文章</button><button type="submit" id="publish" class="ef-btn ef-btn-primary">发布归档 ↗</button></div></div>
<div class="meta-grid"><label class="wide">文章标题<input id="title" name="title" required maxlength="240" placeholder="给这条工程记录一个标题"></label><label>所属扇区<select id="sector" name="sector"><option value="SEC_01">SEC_01 // 算法与智能控制</option><option value="SEC_02">SEC_02 // 系统工程与造物</option><option value="SEC_03">SEC_03 // 网络与终端架构</option><option value="SEC_04">SEC_04 // 光学影像归档</option></select></label><label>标签<input id="tags-input" name="tags" placeholder="MATLAB,CONTROL_SYS"></label><label class="wide">摘要<textarea id="excerpt" name="excerpt" rows="2" maxlength="1000" placeholder="可留空，发布时自动提取正文前100字"></textarea></label><label class="wide">封面图片地址<input id="cover-url" name="cover_url" placeholder="上传图片或填写 HTTPS 图片地址"></label></div>
<div class="editor-tools"><label class="check-label"><input id="is-pinned" type="checkbox">设为置顶</label><button type="button" id="cover-upload" class="ef-filter-chip">上传封面</button><button type="button" id="insert-image" class="ef-filter-chip">插入图片</button><input type="file" id="image-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><input type="file" id="cover-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><span id="upload-status" role="status"></span></div>
<div class="markdown-workspace"><section><h3>MARKDOWN // 正文源稿</h3><p class="editor-hint">可粘贴截图、拖入图片，或点击“插入图片”。支持代码与数学公式。</p><textarea id="content-md" name="content_md" required spellcheck="false" placeholder="## 开始记录&#10;&#10;写下你的观察与实验…"></textarea></section><section><h3>LIVE_PREVIEW // 实时预览</h3><div id="markdown-preview" class="markdown-body"></div></section></div>
<p id="save-status" role="status" aria-live="polite"></p>
</form>
<section class="post-manager"><div class="editor-heading"><h2>MANAGE_LOGS // 已发布归档</h2><form id="manage-search"><input id="manage-query" type="search" placeholder="搜索标题或摘要" aria-label="搜索已发布归档"><button type="submit" class="ef-filter-chip">检索</button></form></div><div id="managed-posts"></div><div class="manager-pages"><button type="button" class="ef-filter-chip" id="manage-prev">上一页</button><span id="manage-page"></span><button type="button" class="ef-filter-chip" id="manage-next">下一页</button></div><p id="manage-status" role="status"></p></section>
</main></body></html>
