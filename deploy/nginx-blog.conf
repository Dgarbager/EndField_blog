# Merge these locations into the existing blog.garbager.de HTTPS server block.
# Keep the current certificate, HTTPS redirect, and unrelated virtual hosts.
client_max_body_size 18m;

# Proxy the entire site so API, uploads, RSS and pages share one origin.
# Storage, backend source and configuration files are never served as static files.
location / {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
}
